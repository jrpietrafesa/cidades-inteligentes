server:
  port: ${SERVER_PORT:8080}

app:
  environment: ${APP_ENV:local}
  version: ${APP_VERSION:dev}

spring:
  application:
    name: cidades-esg-inteligentes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cidades_esg}
    username: ${DB_USER:esg}
    password: ${DB_PASSWORD:esg}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
